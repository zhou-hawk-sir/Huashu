project:
  permissions:
    deny:
      - "shell.execute:rm\\s+-rf\\s+/(?!tmp/|var/tmp/|home/)"
      - "shell.execute:rm\\s+-rf\\s+/etc"
      - "shell.execute:rm\\s+-rf\\s+/boot"
      - "shell.execute:chmod\\s+(-R\\s+)?777"
      - "shell.execute:chown\\s+(-R\\s+)?root"
      - "shell.execute:systemctl\\s+(stop|disable)\\s+(sshd|network|firewalld)"
      - "shell.execute::\\(\\)\\{:\\|:&\\};:"
      - "shell.execute:iptables\\s+-F"
      - "shell.execute:.*>\\s*/etc/(passwd|shadow|sudoers)"
      - "file.write:/etc/.*"
      - "file.write:/boot/.*"
    ask:
      - "shell.execute:systemctl\\s+(restart|reload|try-restart)"
      - "shell.execute:systemctl\\s+(start|enable|disable)"
      - "shell.execute:(yum|dnf|rpm|apt)\\s+(install|erase|update)"
      - "shell.execute:(useradd|userdel|usermod|passwd)\\b"
      - "shell.execute:(iptables|nft)\\s+.*"
      - "shell.execute:(mkfs|fdisk|parted|dd)\\b"
    allow:
      - "shell.execute:^(cat|less|head|tail|grep|find|ls|stat|file|which|whereis)\\b"
      - "shell.execute:^(ps|top|htop|lsof|netstat|ss|ip)\\b"
      - "shell.execute:^(df|du|free|uptime|uname|hostname|date)\\b"
      - "shell.execute:^(mkdir|touch|echo)\\b"
      - "shell.execute:^(ping|traceroute|curl|wget)\\b"
      - "system.distro"
      - "system.kernel"
      - "system.cpu"
      - "system.meminfo"
      - "system.network_interfaces"
      - "system.disks"
      - "shell.history"
      - "shell.aliases"
      - "shell.env"
      - "shell.executables"
