# 示例配置 — 复制本文件为 settings.yaml 后填入敏感信息
# 实际部署建议通过环境变量覆盖 api_key 等字段

server:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  log_level: "info"

llm:
  provider: "deepseek"  # 生产改为 deepseek 或 qwen
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-chat"
  timeout: 30
  max_tokens: 4096
  temperature: 0.2

safety:
  injection_detection: true
  risk_classification: true
  require_confirmation_for_medium: true
  llm_self_check: false

  # 严格模式（allow / ask / deny）：
  # - default_user: 留空 = 当前用户（不再强制 nobody）
  # - elevated 工具真正提权到 root（在 allow_root_for_tools 白名单内）
  default_user: null
  elevated_user: "opsagent"  # 已弃用，保留兼容
  deny_root: false

  allow_root_for_tools:
    - "shell.execute_elevated"  # 等价于 sandbox.enabled=false

  # 可选沙箱
  sandbox:
    enabled: false
    profile: "shell_execute"
    auto_allow_bash_if_sandboxed: false

audit:
  chain_log_dir: "./logs/chain"
  sqlite_path: "./data/audit.db"
  retention_days: 90
  mirror_to_jsonl: true

mcp:
  transport: "stdio"
  manifest_path: "./mcp/manifest.yaml"
# ────────────────────────────────────────────────────────────────────
# 记忆层（V5.4）
# 独立 memory.db，与 audit.db 分离：审计只增不改，记忆要频繁更新与删除。
# 本段全部可调，代码里不写死参数。
# ────────────────────────────────────────────────────────────────────
memory:
  enabled: true
  db_path: "./data/memory.db"
  retrieve_k: 5              # 每次检索返回条数
  inject_max_items: 3        # 注入提示词的最大条目数
  inject_max_chars: 1200     # 注入块字符上限
  stale_after_days: 180      # 超过 N 日未验证 → stale（降权不删除）
  trust_threshold: 0.40      # 低于此信任度 → 写入隔离区
  merge_threshold: 0.62      # 同症状同结论的合并阈值
  write_enabled: true         # 是否允许从会话结果自动沉淀经验

  # 打分参数：Score = (α·Sim + β·Env + γ·Success + δ·Freshness) × Π penalty
  # 初值待预实验标定，调整后需重跑 MemBench 四组对照
  score:
    alpha: 0.40
    beta: 0.30
    gamma: 0.20
    delta: 0.10
    penalty_os: 0.30
    penalty_arch: 0.10
    penalty_kernel: 0.70
    penalty_dep: 0.70
    penalty_stale: 0.50
    freshness_half_life_days: 90
