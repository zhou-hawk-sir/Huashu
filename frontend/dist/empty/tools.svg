<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>空状态 — 工具仓库</title>

  <!-- 底层网格（低透明度冷灰） -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 L0 24" fill="none" stroke="#8A92A2" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="60" y="60" width="360" height="240" fill="url(#grid)"/>
  <rect x="60" y="60" width="360" height="240" stroke="#8A92A2" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- 工具图标（仅轮廓·柠檬黄） -->

  <!-- 扳手（左上） -->
  <g transform="translate(120 110) rotate(-30)" stroke="#FFD320" stroke-width="2" fill="none">
    <path d="M0 0 L34 0 L40 6 L34 12 L0 12 Z"/>
    <circle cx="44" cy="6" r="6"/>
    <line x1="6" y1="0" x2="6" y2="12"/>
    <line x1="20" y1="0" x2="20" y2="12"/>
  </g>

  <!-- 终端（中上） -->
  <g transform="translate(210 90)" stroke="#FFD320" stroke-width="2" fill="none">
    <rect x="0" y="0" width="80" height="50"/>
    <line x1="0" y1="12" x2="80" y2="12"/>
    <polyline points="10,22 18,30 10,38"/>
    <line x1="22" y1="38" x2="42" y2="38"/>
  </g>

  <!-- 监控框（右上） -->
  <g transform="translate(320 90)" stroke="#FFD320" stroke-width="2" fill="none">
    <rect x="0" y="0" width="80" height="50"/>
    <polyline points="8,38 22,22 36,30 56,12 72,20"/>
    <line x1="0" y1="58" x2="80" y2="58"/>
    <line x1="34" y1="58" x2="46" y2="58"/>
    <line x1="40" y1="58" x2="40" y2="66"/>
  </g>

  <!-- 信号天线（中下） -->
  <g transform="translate(140 210)" stroke="#FFD320" stroke-width="2" fill="none">
    <circle cx="20" cy="40" r="3" fill="#FFD320"/>
    <path d="M8 30 A18 18 0 0 1 32 30"/>
    <path d="M2 22 A26 26 0 0 1 38 22"/>
    <line x1="14" y1="40" x2="14" y2="55"/>
    <line x1="26" y1="40" x2="26" y2="55"/>
  </g>

  <!-- 齿轮（右下） -->
  <g transform="translate(240 200)" stroke="#FFD320" stroke-width="2" fill="none">
    <circle cx="30" cy="30" r="20"/>
    <circle cx="30" cy="30" r="8"/>
    <g>
      <line x1="30" y1="4" x2="30" y2="12"/>
      <line x1="30" y1="48" x2="30" y2="56"/>
      <line x1="4" y1="30" x2="12" y2="30"/>
      <line x1="48" y1="30" x2="56" y2="30"/>
      <line x1="12" y1="12" x2="18" y2="18"/>
      <line x1="42" y1="42" x2="48" y2="48"/>
      <line x1="12" y1="48" x2="18" y2="42"/>
      <line x1="42" y1="18" x2="48" y2="12"/>
    </g>
  </g>

  <!-- 数据块（最右） -->
  <g transform="translate(330 210)" stroke="#FFD320" stroke-width="2" fill="none">
    <rect x="0" y="14" width="10" height="20"/>
    <rect x="14" y="6" width="10" height="28"/>
    <rect x="28" y="20" width="10" height="14"/>
    <rect x="42" y="0" width="10" height="34"/>
    <line x1="0" y1="40" x2="60" y2="40"/>
  </g>
</svg>
