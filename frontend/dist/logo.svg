<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>麒麟智能运维 Agent — Logo</title>

  <!-- 外框 -->
  <rect x="6" y="6" width="244" height="244" stroke="#8A92A2" stroke-width="2"/>

  <!-- 四角黄色衬块 -->
  <rect x="6" y="6" width="28" height="6" fill="#FFD320"/>
  <rect x="6" y="6" width="6" height="28" fill="#FFD320"/>
  <rect x="222" y="6" width="28" height="6" fill="#FFD320"/>
  <rect x="244" y="6" width="6" height="28" fill="#FFD320"/>
  <rect x="6" y="244" width="28" height="6" fill="#FFD320"/>
  <rect x="6" y="222" width="6" height="28" fill="#FFD320"/>
  <rect x="222" y="244" width="28" height="6" fill="#FFD320"/>
  <rect x="244" y="222" width="6" height="28" fill="#FFD320"/>

  <!-- 电路走线（四向引出） -->
  <g stroke="#8A92A2" stroke-width="2">
    <path d="M128 36 L128 60 L108 80"/>
    <path d="M128 60 L148 80"/>
    <path d="M220 128 L196 128 L176 108"/>
    <path d="M196 128 L176 148"/>
    <path d="M128 220 L128 196 L108 176"/>
    <path d="M128 196 L148 176"/>
    <path d="M36 128 L60 128 L80 108"/>
    <path d="M60 128 L80 148"/>
  </g>

  <!-- 引脚节点 -->
  <g fill="#8A92A2">
    <circle cx="128" cy="36" r="3"/>
    <circle cx="220" cy="128" r="3"/>
    <circle cx="128" cy="220" r="3"/>
    <circle cx="36" cy="128" r="3"/>
  </g>

  <!-- 中央芯片方块 -->
  <rect x="92" y="92" width="72" height="72" stroke="#FFD320" stroke-width="2" fill="none"/>
  <!-- 芯片内侧脚位 -->
  <g stroke="#FFD320" stroke-width="2">
    <line x1="100" y1="92" x2="100" y2="100"/>
    <line x1="116" y1="92" x2="116" y2="100"/>
    <line x1="132" y1="92" x2="132" y2="100"/>
    <line x1="148" y1="92" x2="148" y2="100"/>
    <line x1="100" y1="164" x2="100" y2="156"/>
    <line x1="116" y1="164" x2="116" y2="156"/>
    <line x1="132" y1="164" x2="132" y2="156"/>
    <line x1="148" y1="164" x2="148" y2="156"/>
    <line x1="92" y1="100" x2="100" y2="100"/>
    <line x1="92" y1="116" x2="100" y2="116"/>
    <line x1="92" y1="132" x2="100" y2="132"/>
    <line x1="92" y1="148" x2="100" y2="148"/>
    <line x1="164" y1="100" x2="156" y2="100"/>
    <line x1="164" y1="116" x2="156" y2="116"/>
    <line x1="164" y1="132" x2="156" y2="132"/>
    <line x1="164" y1="148" x2="156" y2="148"/>
  </g>

  <!-- 中央龙鳞菱形（叠瓦） -->
  <g fill="none" stroke="#FFD320" stroke-width="2">
    <path d="M128 102 L150 128 L128 154 L106 128 Z"/>
    <path d="M114 116 Q128 108 142 116"/>
    <path d="M114 132 Q128 124 142 132"/>
    <path d="M114 148 Q128 140 142 148"/>
  </g>

  <!-- 中心点 -->
  <circle cx="128" cy="128" r="3" fill="#FFD320"/>
</svg>
